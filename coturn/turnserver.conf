# Self-hosted coturn configuration for Holy Moly! 3-way native WebRTC family calls
# Supports UDP 3478, TCP 3478, and TLS on port 443 for restrictive firewalls / symmetric carrier NAT.
#
# Before deploying:
# 1. Replace `turn.yourdomain.com` with your DNS hostname pointing to this server.
# 2. Replace `CHANGE_ME_GENERATE_WITH_OPENSSL_RAND_HEX_32` with a strong random secret
#    (and set the exact same value as `TURN_SHARED_SECRET` in Supabase Edge Function secrets).
# 3. Point `cert` and `pkey` to your Let's Encrypt fullchain.pem / privkey.pem.

listening-port=3478
tls-listening-port=443

# Enable both UDP and TCP on 3478, plus TLS over TCP on 443
fingerprint
use-auth-secret
static-auth-secret=CHANGE_ME_GENERATE_WITH_OPENSSL_RAND_HEX_32
realm=turn.yourdomain.com

# TLS certificates (mounted via docker-compose.yml)
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
cipher-list="ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"

# Relay port range (open UDP 49152-65535 on your firewall)
min-port=49152
max-port=65535

# Security hardening
no-cli
no-loopback-peers
no-multicast-peers
stale-nonce=600
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

# Capacity limits suitable for 3-way family video calls
total-quota=60
bps-capacity=0
simple-log
log-file=stdout
