services:
  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: holymoly-coturn
    restart: unless-stopped
    # Host networking avoids Docker NAT overhead for UDP media relay ports (49152-65535)
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
      - /etc/letsencrypt/live/turn.yourdomain.com/fullchain.pem:/etc/coturn/certs/fullchain.pem:ro
      - /etc/letsencrypt/live/turn.yourdomain.com/privkey.pem:/etc/coturn/certs/privkey.pem:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
